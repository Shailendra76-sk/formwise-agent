<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwise Demo Application</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}label{display:block;margin:14px 0 4px;font-weight:700}input{width:100%;padding:9px;box-sizing:border-box}button{margin-top:18px;padding:10px 16px} .captcha{padding:12px;background:#eee;font:700 22px monospace;letter-spacing:5px}.demo-note{padding:10px;border:1px solid #999;background:#f7f7f7}</style></head>
<body><h1>Formwise Demo Application</h1><p>This local-only target is for safe end-to-end testing.</p>
<p id="self-heal-note" class="demo-note" hidden>SELF-HEALING MODE: machine IDs/names were intentionally changed; visible labels and accessibility context remain stable.</p>
<form method="post" action="/submit" enctype="multipart/form-data">
<label>Full Name</label><input id="fullName" name="fullName" autocomplete="name" aria-label="Full Name">
<label>Date of Birth</label><input id="dob" name="dob" type="date" autocomplete="bday" aria-label="Date of Birth">
<label>Email</label><input id="email" name="email" type="email" autocomplete="email" aria-label="Email">
<label>Mobile Number</label><input id="mobile" name="mobile" type="tel" autocomplete="tel" aria-label="Mobile Number">
<label>Upload Photo</label><input name="photo" type="file">
<label>Upload Signature</label><input name="signature" type="file">
<label>Captcha</label><div class="captcha">7 X 9 K 2</div><input name="captcha" autocomplete="off" aria-label="Captcha">
<label>OTP <button type="button" onclick="sendOtp()">Send OTP</button></label><input name="otp" inputmode="numeric" autocomplete="one-time-code" aria-label="OTP">
<button id="submit" type="submit">Submit Application</button></form>
<script>
async function sendOtp(){await fetch('/generate-otp');alert('Demo OTP generated. Check the demo server console.');}
if(new URLSearchParams(location.search).get('self_heal')==='1'){
  document.getElementById('self-heal-note').hidden=false;
  const mutations={fullName:['fw_runtime_name_91','fw_runtime_id_91'],dob:['fw_runtime_birth_42','fw_runtime_id_42'],email:['fw_runtime_contact_73','fw_runtime_id_73'],mobile:['fw_runtime_phone_64','fw_runtime_id_64']};
  for(const [id,[name,newId]] of Object.entries(mutations)){
    const el=document.getElementById(id); el.name=name; el.id=newId;
  }
}
</script></body></html>
