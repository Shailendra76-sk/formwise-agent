name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      # CI runners do not need a GUI. Keep browser tests deterministic and
      # memory-friendly by explicitly forcing Playwright headless mode.
      FORMWISE_BROWSER_HEADLESS: "true"
      # The local demo browser target is used only by the browser E2E test.
      FORMWISE_BROWSER_ALLOW_LOCAL_DEMO_TARGET: "true"
      # Browser Use remains opt-in in CI; its LLM/browser workload is not part
      # of the deterministic unit-test suite.
      FORMWISE_BROWSER_USE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check migrations
        run: alembic upgrade head
