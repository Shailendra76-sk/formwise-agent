name: Local Demo Browser E2E

on:
  push:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "demo-target-site/**"
      - ".github/workflows/demo-browser-e2e.yml"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      FORMWISE_ENVIRONMENT: development
      FORMWISE_BROWSER_ALLOW_LOCAL_DEMO_TARGET: "true"
      FORMWISE_BROWSER_DEMO_TARGET_PORT: "5000"
      FORMWISE_BROWSER_BLOCK_PRIVATE_NETWORKS: "true"
      FORMWISE_BROWSER_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-target-site/package.json
      - name: Install demo target
        working-directory: demo-target-site
        run: npm install
      - name: Start demo target
        working-directory: demo-target-site
        run: npm start > /tmp/formwise-demo.log 2>&1 &
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser E2E test
        run: python -m pytest -q tests/test_demo_browser.py
      - name: Demo target log
        if: always()
        run: cat /tmp/formwise-demo.log || true
